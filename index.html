<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>塗料・資材 緊急共有ネット</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <div>
      <a href="index.html" class="header-title">塗料・資材 緊急共有ネット</a>
      <div class="header-subtitle">困った時は、仲間で回す。</div>
    </div>
    <nav class="header-nav">
      <a href="rules.html">ルール</a>
    </nav>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active sell-tab" data-type="sell">売ります</button>
      <button class="tab-btn buy-tab" data-type="buy">買います</button>
    </div>

    <!-- Search/Filter UI placeholder for MVP (visual only) -->
    <div class="filter-bar">
      <select class="filter-select">
        <option>地域: 全て</option>
        <option>北海道</option>
        <option>青森県</option>
        <option>岩手県</option>
        <option>宮城県</option>
        <option>秋田県</option>
        <option>山形県</option>
        <option>福島県</option>
        <option>茨城県</option>
        <option>栃木県</option>
        <option>群馬県</option>
        <option>埼玉県</option>
        <option>千葉県</option>
        <option>東京都</option>
        <option>神奈川県</option>
        <option>新潟県</option>
        <option>富山県</option>
        <option>石川県</option>
        <option>福井県</option>
        <option>山梨県</option>
        <option>長野県</option>
        <option>岐阜県</option>
        <option>静岡県</option>
        <option>愛知県</option>
        <option>三重県</option>
        <option>滋賀県</option>
        <option>京都府</option>
        <option>大阪府</option>
        <option>兵庫県</option>
        <option>奈良県</option>
        <option>和歌山県</option>
        <option>鳥取県</option>
        <option>島根県</option>
        <option>岡山県</option>
        <option>広島県</option>
        <option>山口県</option>
        <option>徳島県</option>
        <option>香川県</option>
        <option>愛媛県</option>
        <option>高知県</option>
        <option>福岡県</option>
        <option>佐賀県</option>
        <option>長崎県</option>
        <option>熊本県</option>
        <option>大分県</option>
        <option>宮崎県</option>
        <option>鹿児島県</option>
        <option>沖縄県</option>
        <option>その他</option>
      </select>
      <select class="filter-select">
        <option>種類: 全て</option>
        <option>塗料</option>
        <option>シンナー</option>
        <option>副資材</option>
      </select>
      <select class="filter-select">
        <option>緊急度: 全て</option>
        <option>緊急</option>
      </select>
    </div>

    <div id="post-list" class="post-list">
      <!-- Posts will be generated here by JavaScript -->
    </div>
  </main>

  <!-- Modal -->
  <div id="post-modal" class="modal-overlay">
    <div class="modal-content">
      <div id="close-modal" class="modal-close"></div>
      <div id="modal-body" class="modal-body">
        <!-- Content will be injected via JS -->
      </div>
    </div>
  </div>

  <a href="post.html" class="fab">＋</a>

  <script src="assets/js/main.js"></script>
</body>
</html>
